name: Bug report
description: Something failed or gave a wrong result.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: command
    attributes:
      label: Command
      render: bash
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cellwarden doctor`
      render: text
  - type: textarea
    id: log
    attributes:
      label: Last lines of the failing stage's log (<run>/logs/<stage>.log)
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "cellwarden 0.3.0, image cellwarden/cellwarden:0.3.0"
