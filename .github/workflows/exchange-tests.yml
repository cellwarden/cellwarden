name: exchange-tests

# Seurat <-> AnnData exchange format (docs/exchange-spec.md):
# R unit tests, Python unit tests and the cross-language round-trip.

on:
  push:
    paths:
      - "R/**"
      - "python/**"
      - "tests/**"
      - "docs/exchange-spec.md"
      - ".github/workflows/exchange-tests.yml"
      - "tools/in_image.sh"
  pull_request:
    paths:
      - "R/**"
      - "python/**"
      - "tests/**"
      - "docs/exchange-spec.md"
      - ".github/workflows/exchange-tests.yml"
      - "tools/in_image.sh"
  workflow_dispatch:

concurrency:
  group: exchange-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exchange:
    # The suites need the whole pipeline stack (Seurat, leidenbase, harmony, MAST, DESeq2, scDblFinder,
    # scfastR, scanpy, CellTypist), so they run inside the released image, the environment users run.
    # The checkout's code is tested (tests/python/conftest.py points CELLWARDEN_REPO_ROOT at it); the
    # image supplies the packages, so a change that needs a new package also needs a new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/cellwarden/cellwarden:latest
    steps:
      - name: Free disk (the image is ~10 GB unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Pull the image
        run: docker pull "$IMAGE"

      - name: Versions
        run: |
          ./tools/in_image.sh Rscript -e 'for (p in c("Seurat", "SeuratObject", "testthat", "scfastR")) cat(p, format(packageVersion(p)), "\n")'
          ./tools/in_image.sh python -c 'import importlib.metadata as m; print({p: m.version(p) for p in ["anndata", "scanpy", "numpy", "scfast"]})'

      # tools/in_image.sh: one container per step, the checkout mounted at the same path
      - name: Fixture files match expected.json
        run: ./tools/in_image.sh python tests/fixtures/make_fixture.py --verify

      # numpy does not guarantee identical random streams across releases, so a
      # byte-for-byte regeneration is informative only; the committed files rule.
      - name: Fixture generator still reproduces the committed files (advisory)
        continue-on-error: true
        run: ./tools/in_image.sh python tests/fixtures/make_fixture.py --check

      - name: R unit tests
        run: ./tools/in_image.sh Rscript -e 'res <- testthat::test_dir("tests/R", reporter = "summary", stop_on_failure = TRUE)'

      - name: Python unit tests
        run: ./tools/in_image.sh python -m pytest -q -rs tests/python

      - name: Cross-language round-trip
        run: |
          mkdir -p "$RUNNER_TEMP/roundtrip"
          ./tools/in_image.sh env PYTHON=python bash tests/integration/run_roundtrip.sh "$RUNNER_TEMP/roundtrip"

      - name: Upload round-trip workdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-workdir
          path: ${{ runner.temp }}/roundtrip
          retention-days: 7
