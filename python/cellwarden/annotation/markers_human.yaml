# Human cell-type marker reference for the code-only consensus annotation
# (docs/agents-spec.md section 5; python/cellwarden/annotation/consensus.py).
#
# One entry per fine label:
#   label_fine        the fine label written to annotation_consensus.tsv
#   label_broad       the broad label (several fine labels share one)
#   cl_id             Cell Ontology ID of the fine label
#   generic           true for the broad group's umbrella entry (used when
#                     fine labels inside the same broad group tie)
#   markers           canonical positive marker genes (symbols)
#   celltypist_labels CellTypist labels (Immune_All_Low / High and the tissue
#                     models) that vote for this entry; matched case-insensitively
#   tissue            where the type is usually found (hint only)
#
# Signature sets in R/stages/data/signatures.yaml vote for an entry through
# their `cell_type`, which must equal a label_fine here.
version: 1
cell_types:
